<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-title="reg_title">Đăng ký học viên - Toukutei 2</title>
    <style>
        body { font-family: "Be Vietnam Pro","Noto Sans JP",sans-serif; background: #F4F4F1; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .register-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #C8102E; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #64748b; }
        input, select { width: 100%; padding: 10px; border: 1.5px solid #E7E7E0; border-radius: 12px; box-sizing: border-box; font-family: inherit; }
        .btn-register { width: 100%; padding: 12px; background: #C8102E; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-register:hover { background: #A50D26; }
        .or-divider { display: flex; align-items: center; gap: 10px; margin: 16px 0 12px; }
        .or-divider::before, .or-divider::after { content: ""; flex: 1; height: 1px; background: #E7E7E0; }
        .or-divider span { font-size: 12px; color: #8B8B84; }
        .btn-google { width: 100%; padding: 12px; background: #ffffff; color: #3c4043; border: 1.5px solid #dadce0; border-radius: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: inherit; font-size: 14px; }
        .btn-google:hover { background: #f8f9fa; }
        .btn-google:disabled { opacity: .6; cursor: wait; }
        .login-link { text-align: center; margin-top: 15px; font-size: 13px; }
        .login-link a { color: #C8102E; text-decoration: none; font-weight: bold; }
    </style>
    <script src="i18n.js"></script>
</head>
<body>

<div class="register-card">
    <h2 data-i18n="reg_heading">Đăng Ký Thành Viên</h2>
    <div class="form-group">
        <label data-i18n="label_name">Họ và tên</label>
        <input type="text" id="reg-name" data-i18n-ph="ph_name" placeholder="Nhập tên của bạn">
    </div>

    <div class="form-group">
        <label data-i18n="label_group">Bạn thuộc nhóm nào?</label>
        <select id="reg-group">
            <option value="1" data-i18n="group_1">Nhóm 1 (doboku)</option>
            <option value="2" data-i18n="group_2">Nhóm 2 (kenchiku)</option>
            <option value="3" data-i18n="group_3">Nhóm 3 (setsubi)</option>
        </select>
    </div>

    <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="example@gmail.com">
    </div>
    <div class="form-group">
        <label data-i18n="label_password">Mật khẩu</label>
        <input type="password" id="reg-password" data-i18n-ph="ph_password_min" placeholder="Tối thiểu 6 ký tự">
    </div>
    <button class="btn-register" id="btn-submit" data-i18n="btn_register_now">Đăng ký ngay</button>

    <div class="or-divider"><span>hoặc</span></div>
    <button class="btn-google" id="btn-google" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571.001-.001.002-.001.003-.002l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
        <span>Đăng nhập bằng Google</span>
    </button>

    <div class="login-link">
        <span data-i18n="have_account">Đã có tài khoản?</span> <a href="login.html" data-i18n="btn_login">Đăng nhập</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithRedirect, getRedirectResult, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyALblbqW_VrZh2r7sPJ8Q6XT2fGbk0dsFg",
        authDomain: "donghung-3208d.firebaseapp.com",
        projectId: "donghung-3208d",
        storageBucket: "donghung-3208d.firebasestorage.app",
        messagingSenderId: "753379492663",
        appId: "1:753379492663:web:baff34f2c0bac00e02d0b2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // --- Gán mã thành viên TVxxxx: transaction tăng meta/counters.memberSeq (có mã rồi thì giữ nguyên) ---
    async function assignMemberCode(uid) {
        const counterRef = doc(db, "meta", "counters");
        const userRef = doc(db, "users", uid);
        let code = null;
        await runTransaction(db, async (tx) => {
            const uSnap = await tx.get(userRef);
            if (uSnap.exists() && uSnap.data().memberCode) { code = uSnap.data().memberCode; return; }
            const cSnap = await tx.get(counterRef);
            const next = ((cSnap.exists() && cSnap.data().memberSeq) || 0) + 1;
            code = "TV" + String(next).padStart(4, "0");
            tx.set(counterRef, { memberSeq: next }, { merge: true });
            tx.update(userRef, { memberCode: code });
        });
        return code;
    }

    document.getElementById('btn-submit').addEventListener('click', async () => {
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        
        // VỊ TRÍ CHÈN 2: Lấy giá trị nhóm đã chọn
        const group = document.getElementById('reg-group').value;

        if (!name || !email || !password) {
            alert(t("err_fill_all"));
            return;
        }

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            // VỊ TRÍ CHÈN 3: Đưa thông tin group vào Firestore
            await setDoc(doc(db, "users", user.uid), {
                name: name,
                email: email,
                group: group,             // Lưu số nhóm (1 hoặc 2)
                status: "active",
                isPremium: false,
                device_count: 0,
                devices: {},
                exam_progress: {
                    doboku: 0,
                    kenchiku: 0
                },
                createdAt: new Date().toISOString()
            });

            try { await assignMemberCode(user.uid); } catch (e) { console.warn("Gán mã thành viên:", e); }

            alert(t("reg_success"));
            window.location.href = "language.html";

        } catch (error) {
            console.error("Lỗi đăng ký:", error);
            let msg = t("err_unknown");
            if (error.code === 'auth/email-already-in-use') msg = t("err_email_in_use");
            if (error.code === 'auth/weak-password') msg = t("err_weak_password");
            alert(msg);
        }
    });
    // --- Đăng nhập bằng Google từ trang đăng ký (redirect, an toàn trên mobile/PWA) ---
    // Tài khoản CHƯA có hồ sơ -> tạo hồ sơ đúng mẫu đăng ký + gán mã thành viên.
    // ĐÃ có hồ sơ -> không tạo trùng; mời đăng nhập ở login.html, nơi có đủ kiểm tra khóa máy/banned.
    document.getElementById('btn-google').addEventListener('click', async () => {
        sessionStorage.setItem('reg_group', document.getElementById('reg-group').value);
        const gBtn = document.getElementById('btn-google');
        gBtn.disabled = true;
        try {
            await signInWithRedirect(auth, new GoogleAuthProvider());
        } catch (error) {
            console.error("Lỗi Google:", error);
            gBtn.disabled = false;
            alert(t("err_unknown"));
        }
    });

    getRedirectResult(auth).then(async (result) => {
        if (!result || !result.user) return;
        const user = result.user;
        try {
            const userRef = doc(db, "users", user.uid);
            const snap = await getDoc(userRef);
            if (snap.exists()) {
                await signOut(auth);
                alert("Email này đã có tài khoản. Hãy đăng nhập nhé.");
                window.location.href = "login.html";
                return;
            }
            await setDoc(userRef, {
                name: user.displayName || "Học viên",
                email: user.email,
                group: sessionStorage.getItem('reg_group') || "1",
                status: "active",
                isPremium: false,
                device_count: 0,
                devices: {},
                exam_progress: {
                    doboku: 0,
                    kenchiku: 0
                },
                createdAt: new Date().toISOString()
            });
            try { await assignMemberCode(user.uid); } catch (e) { console.warn("Gán mã thành viên:", e); }
            alert(t("reg_success"));
            window.location.href = "language.html";
        } catch (error) {
            console.error("Lỗi tạo hồ sơ Google:", error);
            alert(t("err_unknown"));
        }
    }).catch((error) => {
        console.error("Lỗi Google:", error);
        if (error.code === 'auth/account-exists-with-different-credential') {
            alert("Email này đã đăng ký bằng mật khẩu. Hãy đăng nhập bằng mật khẩu như cũ nhé.");
            window.location.href = "login.html";
        }
    });
</script>
</body>
</html>
