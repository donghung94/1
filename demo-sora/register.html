<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-title="reg_title">Đăng ký học viên - Toukutei 2</title>
    <style>
        body { font-family: "Be Vietnam Pro","Noto Sans JP",sans-serif; background: #F4F4F1; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .register-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #C8102E; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #64748b; }
        input, select { width: 100%; padding: 10px; border: 1.5px solid #E7E7E0; border-radius: 12px; box-sizing: border-box; font-family: inherit; }
        .btn-register { width: 100%; padding: 12px; background: #C8102E; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-register:hover { background: #A50D26; }
        .login-link { text-align: center; margin-top: 15px; font-size: 13px; }
        .login-link a { color: #C8102E; text-decoration: none; font-weight: bold; }
    </style>
    <script src="i18n.js"></script>
</head>
<body>

<div class="register-card">
    <h2 data-i18n="reg_heading">Đăng Ký Thành Viên</h2>
    <div class="form-group">
        <label data-i18n="label_name">Họ và tên</label>
        <input type="text" id="reg-name" data-i18n-ph="ph_name" placeholder="Nhập tên của bạn">
    </div>

    <div class="form-group">
        <label data-i18n="label_group">Bạn thuộc nhóm nào?</label>
        <select id="reg-group">
            <option value="1" data-i18n="group_1">Nhóm 1 (doboku)</option>
            <option value="2" data-i18n="group_2">Nhóm 2 (kenchiku)</option>
            <option value="3" data-i18n="group_3">Nhóm 3 (setsubi)</option>
        </select>
    </div>

    <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="example@gmail.com">
    </div>
    <div class="form-group">
        <label data-i18n="label_password">Mật khẩu</label>
        <input type="password" id="reg-password" data-i18n-ph="ph_password_min" placeholder="Tối thiểu 6 ký tự">
    </div>
    <button class="btn-register" id="btn-submit" data-i18n="btn_register_now">Đăng ký ngay</button>

    <div class="login-link">
        <span data-i18n="have_account">Đã có tài khoản?</span> <a href="login.html" data-i18n="btn_login">Đăng nhập</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyALblbqW_VrZh2r7sPJ8Q6XT2fGbk0dsFg",
        authDomain: "donghung-3208d.firebaseapp.com",
        projectId: "donghung-3208d",
        storageBucket: "donghung-3208d.firebasestorage.app",
        messagingSenderId: "753379492663",
        appId: "1:753379492663:web:baff34f2c0bac00e02d0b2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    document.getElementById('btn-submit').addEventListener('click', async () => {
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        
        // VỊ TRÍ CHÈN 2: Lấy giá trị nhóm đã chọn
        const group = document.getElementById('reg-group').value;

        if (!name || !email || !password) {
            alert(t("err_fill_all"));
            return;
        }

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            // VỊ TRÍ CHÈN 3: Đưa thông tin group vào Firestore
            await setDoc(doc(db, "users", user.uid), {
                name: name,
                email: email,
                group: group,             // Lưu số nhóm (1 hoặc 2)
                status: "active",
                isPremium: false,
                device_count: 0,
                devices: {},
                exam_progress: {
                    doboku: 0,
                    kenchiku: 0
                },
                createdAt: new Date().toISOString()
            });

            alert(t("reg_success"));
            window.location.href = "language.html";

        } catch (error) {
            console.error("Lỗi đăng ký:", error);
            let msg = t("err_unknown");
            if (error.code === 'auth/email-already-in-use') msg = t("err_email_in_use");
            if (error.code === 'auth/weak-password') msg = t("err_weak_password");
            alert(msg);
        }
    });
</script>
</body>
</html>
